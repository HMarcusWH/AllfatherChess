name: Merge gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile Python and validate configuration syntax
        run: |
          python3 -m compileall -q controller common adapters scripts tests
          python3 -m py_compile allfather-chess
          for config in config/*.json; do python3 -m json.tool "$config" >/dev/null; done

      - name: Run engine-independent contract and controller suites
        run: |
          make telemetry-contract
          make telemetry-adapters
          make controller-tests
          make resource-lab-tests
          python3 -m json.tool qualification/resource-profile-evidence-v1.json >/dev/null
          python3 -m json.tool qualification/resource-profile-selection-v1.json >/dev/null
          python3 scripts/qualify-resource-profile-selection.py --output build/test-results/resource-profile-selection/report.json
          python3 tests/controller/test_resource_profile_selection.py
          python3 -m json.tool qualification/resource-profile-evidence-v2.json >/dev/null
          python3 -m json.tool qualification/resource-profile-evidence-v2-source.json >/dev/null
          python3 -m json.tool qualification/resource-profile-selection-v2.json >/dev/null
          python3 scripts/qualify-resource-profile-selection-v2.py --output build/test-results/resource-profile-selection-v2/report.json
          python3 tests/controller/test_resource_profile_selection_v2.py
          python3 -m json.tool qualification/online-hybrid-v1-resource-calibration.json >/dev/null
          python3 scripts/validate-online-hybrid-resource-calibration.py
          python3 tests/controller/test_online_hybrid_resource_calibration.py
          python3 -m json.tool qualification/adaptive-clock-v1.json >/dev/null
          python3 -m json.tool config/allfather.m14-j-j8.validation.json >/dev/null
          python3 tests/controller/test_move_resource_plan.py
          python3 tests/controller/test_adaptive_time.py
          python3 scripts/qualify-adaptive-time.py
          python3 -m json.tool qualification/work-grant-scheduler-v1.json >/dev/null
          python3 -m json.tool config/allfather.m14-j-j9.validation.json >/dev/null
          python3 tests/controller/test_work_grant.py
          python3 tests/controller/test_work_scheduler.py
          python3 scripts/qualify-work-grant-scheduler.py
          python3 -m json.tool qualification/adaptive-resource-allocation-v1.json >/dev/null
          python3 -m json.tool qualification/j10-calibration-source-v1.json >/dev/null
          python3 -m json.tool qualification/j10-calibration-corpus-v1.json >/dev/null
          python3 -m json.tool qualification/j10-staged-decision-model-v1.json >/dev/null
          python3 -m json.tool qualification/j10-regime-support-model-v1.json >/dev/null
          python3 -m json.tool config/allfather.m14-j-j10.validation.json >/dev/null
          python3 scripts/collect-j10-staged-calibration.py
          python3 scripts/build-j10-allocation-calibration.py
          python3 tests/controller/test_resource_allocator.py
          python3 tests/controller/test_adaptive_resource_router.py
          python3 tests/controller/test_allocation_features.py
          python3 tests/controller/test_orchestration_integrity.py
          python3 tests/controller/test_orchestrated_authority.py
          python3 scripts/qualify-adaptive-resource-allocator.py
          python3 scripts/qualify-resource-orchestration.py --static
          python3 -m py_compile scripts/validate-resource-orchestration.py
