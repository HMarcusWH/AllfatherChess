name: ONLINE-4B guarded offline recovery qualification
on:
  pull_request:
    paths:
      - 'deploy/lichess/**'
      - 'tests/lichess/**'
      - 'tests/fixtures/lichess/**'
      - 'scripts/qualify-online-recovery-v2.py'
      - 'scripts/qualify-online-recovery.py'
      - 'scripts/release-manifest.py'
      - 'scripts/package-online.py'
      - 'scripts/build-online-engine-opt-v2.sh'
      - 'scripts/qualify-engine-opt-v2.py'
      - 'scripts/prepare-online3b-wheels.py'
      - 'scripts/ci-install-apt-deps.sh'
      - 'Makefile'
      - 'deploy/bin/**'
      - 'qualification/online-recovery-v1.json'
      - 'qualification/online-recovery-v2.json'
      - '.github/workflows/online-recovery-v2.yml'
      - 'docs/ONLINE_4B_RECOVERY.md'
      - 'controller/**'
      - 'common/**'
      - 'adapters/**'
      - 'config/**'
      - 'engines/**'
      - 'vendor.lock.json'
  workflow_dispatch:
permissions:
  contents: read
env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: online4b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery-guard-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install frozen offline contract dependencies
        run: |
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages 'pip-tools==7.5.2'
          python3 -m piptools compile --generate-hashes \
            --output-file build-online4b-requirements.lock deploy/lichess/requirements.in
          python3 -m pip install --break-system-packages \
            --require-hashes -r build-online4b-requirements.lock
      - name: Fetch byte-locked upstream for patch-integrity contracts
        run: python3 deploy/lichess/fetch_bridge.py
      - name: Compile and test full legacy + recovery layer
        run: |
          python3 -m py_compile deploy/lichess/*.py tests/lichess/*.py scripts/qualify-online-recovery-v2.py
          python3 -m json.tool qualification/online-recovery-v2.json >/dev/null
          python3 -m unittest discover -s tests/lichess -p 'test_*.py' -v

  guarded-integration:
    needs: recovery-guard-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Prepare engine/toolchain and dependency lock
        run: |
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev python3-pip python3-venv
          python3 -m pip install --break-system-packages 'pip-tools==7.5.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
            build/artifacts/lc0
          key: online4b-networks-${{ runner.os }}-${{ hashFiles('vendor.lock.json','qualification/lc0-strength.lock.json') }}
      - name: Build and verify exact-head three-engine release
        timeout-minutes: 35
        run: |
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
          python3 scripts/release-manifest.py create
          python3 scripts/release-manifest.py verify
          python3 scripts/package-online.py
          python3 dist/online3a-stage/deploy/bin/allfather-online --check
      - name: Lock pinned bridge and prepare immutable wheelhouse
        timeout-minutes: 15
        run: |
          python3 deploy/lichess/fetch_bridge.py
          mkdir -p build/online3b-wheels
          python3 -m piptools compile --generate-hashes \
            --output-file build/online3b-runtime.lock deploy/lichess/requirements.in
          cp build/online3b-runtime.lock deploy/lichess/requirements.lock
          python3 scripts/prepare-online3b-wheels.py \
            --source-lock deploy/lichess/requirements.lock --wheelhouse build/online3b-wheels
      - name: Build offline fixture image only
        timeout-minutes: 15
        run: |
          docker build -f deploy/lichess/Dockerfile.offline \
            --tag allfather-online4b-test:offline .
          docker image inspect allfather-online4b-test:offline \
            --format '{{.Id}}' > build/online4b-image-id.txt
      - name: Execute real guarded bridge scenarios with durable state
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p build/test-results/online-recovery-v2
          python3 - <<'PY' > build/online4b-cases.txt
          import json
          p=json.load(open("qualification/online-recovery-v2.json"))
          for name,colors in p["required"].items():
              for color in colors:
                  print(name,color)
          PY
          while read -r CASE COLOR; do
            echo "ONLINE-4B guarded $CASE/$COLOR"
            docker run --rm --network none --pids-limit 128 \
              --cap-drop ALL --security-opt no-new-privileges \
              --cpus 4 --memory 6g --user "$(id -u):$(id -g)" \
              -e ONLINE4B_ISOLATED_CONTAINER=1 \
              -v "$PWD:/work:ro" \
              -v "$PWD/build/test-results/online-recovery-v2:/results:rw" \
              -w /work allfather-online4b-test:offline \
              /opt/online3b/bin/python /work/deploy/lichess/run_recovery_v2.py \
                --scenario "$CASE" --color "$COLOR" \
                --bridge /work/build/vendor/lichess-bot \
                --release /work/dist/online3a-stage \
                --source-sha "$ALLFATHER_SOURCE_SHA" \
                --timeout 90 --output "/results/$CASE-$COLOR"
          done < build/online4b-cases.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: online4b-guarded-raw-evidence
          path: build/test-results/online-recovery-v2/
          if-no-files-found: error
          retention-days: 30

  independent-guarded-qualification:
    needs: guarded-integration
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install independent chess oracle
        run: |
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages 'chess==1.11.2' 'PyYAML==6.0.3'
      - name: Rebuild expected overlay from independent pinned upstream
        run: python3 deploy/lichess/fetch_bridge.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: online4b-guarded-raw-evidence
          path: build/test-results/online-recovery-v2
      - name: Independently qualify guarded safety and restart continuation
        run: |
          python3 scripts/qualify-online-recovery-v2.py \
            --evidence build/test-results/online-recovery-v2 \
            --source-sha "$ALLFATHER_SOURCE_SHA" \
            --output build/test-results/online4b-verdict/report.json
      - name: Summarize containment versus recovery claims
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("build/test-results/online4b-verdict/report.json")
          print("## ONLINE-4B guarded recovery")
          if not p.exists():
              print("Verdict missing: no recovery claim")
          else:
              x=json.loads(p.read_text())
              for key in ("harness_qualified","containment_qualified_offline",
                          "recovery_qualified_offline","network_recovery_qualified",
                          "public_bot_release","release_blocked"):
                  print(f"- **{key}**: {x.get(key)}")
              for issue in x.get("qualification_failures",[]):
                  print(f"- Failure: {issue}")
              for row in x.get("scenario_results",[]):
                  print(f"- {row['scenario']}/{row['color']}: {row['status']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: online4b-independent-verdict
          path: build/test-results/online4b-verdict/
          if-no-files-found: warn
          retention-days: 30
