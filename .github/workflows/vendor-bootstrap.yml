name: Vendor pinned engine snapshots

on:
  push:
    branches:
      - foundation/monorepo-bootstrap
    paths:
      - vendor.lock.json
      - scripts/vendor-engines.sh
      - scripts/verify-vendor.sh
      - .github/workflows/vendor-bootstrap.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact pinned snapshots
        run: ./scripts/vendor-engines.sh

      - name: Verify provenance and archive completeness
        run: ./scripts/verify-vendor.sh

      - name: Commit vendored sources
        shell: bash
        run: |
          # Force-add because vendored projects contain their own .gitignore
          # files. A file tracked upstream must remain tracked in this
          # monorepo even if the upstream ignore rules also match that path.
          git add -A -f engines

          if git diff --cached --quiet -- engines; then
            echo "Vendored trees already match."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: restore exact pinned engine snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}
