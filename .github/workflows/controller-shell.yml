name: Controller shell validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - controller/**
      - adapters/process/**
      - config/**
      - allfather-chess
      - tests/adapters/test_uci_process.py
      - tests/controller/**
      - tests/fixtures/fake_uci_engine.py
      - tests/harness/**
      - common/**
      - docs/UCI_SHELL.md
      - docs/SHADOW_EXECUTION.md
      - docs/REPLAY_FORMAT.md
      - docs/RESIDUAL_CALIBRATION.md
      - docs/BUDGET_ROUTING.md
      - docs/VERIFY_RELOCK.md
      - docs/COMPARE_RELOCK.md
      - docs/PREFIX_SHARDS.md
      - docs/REFINEMENT.md
      - docs/ACTIVE_SPECIALIST_SCHEDULER.md
      - docs/CROSS_FEED.md
      - docs/DECISION_AUTHORITY.md
      - docs/VALUE_OF_COMPUTE.md
      - docs/STRENGTH_BACKENDS.md
      - qualification/**
      - Makefile
      - .github/workflows/controller-shell.yml
  pull_request:
    paths:
      - controller/**
      - adapters/process/**
      - config/**
      - allfather-chess
      - tests/adapters/test_uci_process.py
      - tests/controller/**
      - tests/fixtures/fake_uci_engine.py
      - tests/harness/**
      - common/**
      - docs/UCI_SHELL.md
      - docs/SHADOW_EXECUTION.md
      - docs/REPLAY_FORMAT.md
      - docs/RESIDUAL_CALIBRATION.md
      - docs/BUDGET_ROUTING.md
      - docs/VERIFY_RELOCK.md
      - docs/COMPARE_RELOCK.md
      - docs/PREFIX_SHARDS.md
      - docs/REFINEMENT.md
      - docs/ACTIVE_SPECIALIST_SCHEDULER.md
      - docs/CROSS_FEED.md
      - docs/DECISION_AUTHORITY.md
      - docs/VALUE_OF_COMPUTE.md
      - docs/STRENGTH_BACKENDS.md
      - qualification/**
      - Makefile
      - .github/workflows/controller-shell.yml

permissions:
  contents: read

concurrency:
  group: controller-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Compile controller shell
        run: |
          python3 -m py_compile allfather-chess controller/*.py common/*.py adapters/process/*.py adapters/telemetry/*.py tests/fixtures/*.py tests/harness/*.py tests/adapters/test_uci_process.py tests/controller/*.py
          python3 -m py_compile scripts/shard-ledger-contract.py scripts/prefix-shard-contract.py scripts/refinement-execution-contract.py scripts/active-specialist-contract.py scripts/crossfeed-contract.py scripts/counterfactual-decision-contract.py scripts/counterfactual-decision-sweep.py scripts/value-of-compute-contract.py scripts/value-of-compute-sweep.py scripts/decision-calibration.py scripts/lc0-strength-lock.py scripts/fetch-lc0-network.py scripts/lc0-hardware-probe.py scripts/lc0-strength-profile-contract.py scripts/refinement-evidence-sweep.py scripts/shadow-execution-contract.py scripts/verification-execution-contract.py scripts/verification-analysis-contract.py scripts/verification-analysis.py scripts/verification-evidence-sweep.py scripts/active-routing-contract.py scripts/residual-calibration.py scripts/shadow-evidence-sweep.py
          for config in config/*.json; do python3 -m json.tool "$config" >/dev/null; done
          ./allfather-chess --help >/dev/null

      - name: Validate process adapter
        run: python3 tests/adapters/test_uci_process.py

      - name: Validate transactional runtime
        run: python3 tests/controller/test_runtime.py

      - name: Validate external UCI frontend
        run: python3 tests/controller/test_uci_frontend.py

      - name: Validate Root ShardLedger invariants
        run: python3 tests/controller/test_shard_ledger.py

      - name: Validate recursive PrefixShardLedger invariants
        run: make prefix-shard-tests

      - name: Validate shadow REFINE execution
        run: make refinement-tests

      - name: Validate active specialist budget scheduler
        run: make active-specialist-tests

      - name: Validate shadow execution runtime
        run: make shadow-tests

      - name: Validate replay bundles
        run: make replay-tests

      - name: Validate residual features and calibration
        run: make residual-tests

      - name: Validate budget accounting and routing policy
        run: make routing-tests

      - name: Validate explicit VERIFY execution
        run: make verification-tests

      - name: Validate COMPARE / RELOCK derived analysis
        run: make verification-analysis-tests

      - name: Validate typed cross-feed evidence
        run: make crossfeed-tests

      - name: Validate counterfactual decision semantics
        run: make decision-tests

      - name: Validate counterfactual decision persistence
        run: make counterfactual-tests

      - name: Validate VERIFY value-of-compute semantics
        run: make value-of-compute-tests

      - name: Validate decision-change calibration
        run: make decision-calibration-tests

      - name: Validate LC0 strength-facing profile contracts
        run: make strength-profile-tests
