name: Baseline engine validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - engines/**
      - adapters/**
      - common/**
      - scripts/**
      - tests/**
      - vendor.lock.json
      - Makefile
      - .github/workflows/baseline.yml
  pull_request:
    paths:
      - engines/**
      - adapters/**
      - common/**
      - scripts/**
      - tests/**
      - vendor.lock.json
      - Makefile
      - .github/workflows/baseline.yml

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate lock and scripts
        run: |
          python3 scripts/vendor-lock.py validate
          python3 -m py_compile             scripts/vendor-lock.py             scripts/golden-baselines.py             scripts/restricted-root-contract.py             scripts/validate-telemetry-contract.py             scripts/telemetry-adapter-integration.py             tests/harness/*.py             common/*.py             adapters/*.py             adapters/telemetry/*.py             tests/telemetry/test_adapters.py
          bash -n scripts/vendor-engines.sh
          bash -n scripts/verify-vendor.sh
          bash -n scripts/fetch-stockfish-network.sh
          bash -n scripts/fetch-reckless-network.sh
          bash -n scripts/build-baselines.sh
          bash -n scripts/smoke-baselines.sh

      - name: Verify declared engine ancestry
        run: ./scripts/verify-vendor.sh

      - name: Cache pinned engine NNUE artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
          key: engine-nnue-${{ runner.os }}-${{ hashFiles('vendor.lock.json') }}

      - name: Fetch and verify pinned engine NNUE artifacts
        run: |
          ./scripts/fetch-stockfish-network.sh >/dev/null
          ./scripts/fetch-reckless-network.sh >/dev/null

      - name: Install LC0 validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev

      - name: Toolchain versions
        run: |
          gcc --version | head -n1
          g++ --version | head -n1
          rustc --version
          cargo --version
          python3 --version
          meson --version
          ninja --version

      - name: Build all three baselines
        env:
          JOBS: "2"
        run: ./scripts/build-baselines.sh

      - name: Reckless restricted-root unit tests
        env:
          EVALFILE: ${{ github.workspace }}/build/artifacts/reckless/v60-7f587dfb.nnue
        run: |
          cd engines/reckless
          cargo test --release --no-default-features

      - name: UCI smoke tests
        run: ./scripts/smoke-baselines.sh

      - name: Verify frozen constituent golden baselines
        run: python3 scripts/golden-baselines.py --verify

      - name: Verify restricted-root controller contract
        run: python3 scripts/restricted-root-contract.py

      - name: Verify live telemetry adapters
        run: python3 scripts/telemetry-adapter-integration.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation-evidence
          path: |
            build/test-results/golden
            build/test-results/restricted-root
            build/test-results/telemetry-adapters
          if-no-files-found: warn
