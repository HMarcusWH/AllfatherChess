name: Baseline engine validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - engines/**
      - adapters/**
      - common/**
      - controller/**
      - config/**
      - allfather-chess
      - scripts/**
      - tests/**
      - vendor.lock.json
      - Makefile
      - .github/workflows/baseline.yml
  pull_request:
    paths:
      - engines/**
      - adapters/**
      - common/**
      - controller/**
      - config/**
      - allfather-chess
      - scripts/**
      - tests/**
      - vendor.lock.json
      - Makefile
      - .github/workflows/baseline.yml

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate lock and scripts
        run: |
          python3 scripts/vendor-lock.py validate
          python3 -m py_compile \
            allfather-chess \
            scripts/vendor-lock.py \
            scripts/fetch-reckless-network.py \
            scripts/reckless-nnue-rerun-contract.py \
            scripts/golden-baselines.py \
            scripts/restricted-root-contract.py \
            scripts/shard-ledger-contract.py \
            scripts/prefix-shard-contract.py \
            scripts/refinement-execution-contract.py \
            scripts/active-specialist-contract.py \
            scripts/crossfeed-contract.py \
            scripts/counterfactual-decision-contract.py \
            scripts/counterfactual-decision-sweep.py \
            scripts/value-of-compute-contract.py \
            scripts/value-of-compute-sweep.py \
            scripts/decision-calibration.py \
            scripts/refinement-evidence-sweep.py \
            scripts/validate-telemetry-contract.py \
            scripts/telemetry-adapter-integration.py \
            scripts/hybrid-shell-contract.py \
            scripts/shadow-execution-contract.py \
            scripts/verification-execution-contract.py \
            scripts/verification-analysis-contract.py \
            scripts/verification-analysis.py \
            scripts/verification-evidence-sweep.py \
            scripts/active-routing-contract.py \
            scripts/residual-calibration.py \
            scripts/shadow-evidence-sweep.py \
            tests/harness/*.py \
            tests/adapters/test_uci_process.py \
            tests/controller/*.py \
            tests/fixtures/fake_uci_engine.py \
            common/*.py \
            controller/*.py \
            adapters/*.py \
            adapters/telemetry/*.py \
            adapters/process/*.py \
            tests/telemetry/test_adapters.py
          for config in config/*.json; do python3 -m json.tool "$config" >/dev/null; done
          bash -n scripts/vendor-engines.sh
          bash -n scripts/verify-vendor.sh
          bash -n scripts/fetch-stockfish-network.sh
          bash -n scripts/fetch-reckless-network.sh
          bash -n scripts/build-baselines.sh
          bash -n scripts/smoke-baselines.sh

      - name: Verify declared engine ancestry
        run: ./scripts/verify-vendor.sh

      - name: Cache pinned engine NNUE artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
          key: engine-nnue-${{ runner.os }}-${{ hashFiles('vendor.lock.json') }}

      - name: Fetch and verify pinned engine NNUE artifacts
        run: |
          ./scripts/fetch-stockfish-network.sh >/dev/null
          ./scripts/fetch-reckless-network.sh >/dev/null

      - name: Install LC0 validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev

      - name: Toolchain versions
        run: |
          gcc --version | head -n1
          g++ --version | head -n1
          rustc --version
          cargo --version
          python3 --version
          meson --version
          ninja --version

      - name: Build all three baselines
        env:
          JOBS: "2"
        run: ./scripts/build-baselines.sh

      - name: Reckless restricted-root unit tests
        env:
          EVALFILE: ${{ github.workspace }}/build/artifacts/reckless/v60-7f587dfb.nnue
        run: |
          cd engines/reckless
          cargo test --release --no-default-features

      - name: Verify Reckless NNUE Cargo rerun contract
        run: python3 scripts/reckless-nnue-rerun-contract.py

      - name: UCI smoke tests
        run: ./scripts/smoke-baselines.sh

      - name: Verify frozen constituent golden baselines
        run: python3 scripts/golden-baselines.py --verify

      - name: Verify restricted-root controller contract
        run: python3 scripts/restricted-root-contract.py

      - name: Verify Root ShardLedger contract
        run: python3 scripts/shard-ledger-contract.py

      - name: Verify recursive prefix-shard contract
        run: python3 scripts/prefix-shard-contract.py

      - name: Verify real-engine shadow REFINE contract
        run: python3 scripts/refinement-execution-contract.py

      - name: Verify active VERIFY REFINE specialist envelope
        run: python3 scripts/active-specialist-contract.py

      - name: Verify real-engine typed cross-feed contract
        run: python3 scripts/crossfeed-contract.py

      - name: Verify real-engine counterfactual decision contract
        run: python3 scripts/counterfactual-decision-contract.py

      - name: Verify real-engine VERIFY value-of-compute contract
        run: python3 scripts/value-of-compute-contract.py

      - name: Verify live telemetry adapters
        run: python3 scripts/telemetry-adapter-integration.py

      - name: Verify real-engine hybrid UCI shell
        run: python3 scripts/hybrid-shell-contract.py

      - name: Verify real-engine shadow execution contract
        run: python3 scripts/shadow-execution-contract.py

      - name: Verify real-engine explicit VERIFY contract
        run: python3 scripts/verification-execution-contract.py

      - name: Verify real-evidence COMPARE / RELOCK analysis contract
        run: python3 scripts/verification-analysis-contract.py

      - name: Verify real-engine active routing contract
        run: python3 scripts/active-routing-contract.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation-evidence
          path: |
            build/test-results/golden
            build/test-results/restricted-root
            build/test-results/shard-ledger
            build/test-results/prefix-shards
            build/test-results/refine-execution
            build/test-results/active-specialist
            build/test-results/crossfeed
            build/test-results/counterfactual
            build/test-results/value-of-compute
            build/test-results/telemetry-adapters
            build/test-results/hybrid-shell
            build/test-results/shadow-execution
            build/test-results/verify-execution
            build/test-results/verify-analysis
            build/verification-derived
            build/test-results/active-routing
          if-no-files-found: warn
