name: Engine optimization v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qualification/engine-opt-*.json'
      - 'qualification/constituent-benchmark-v2.json'
      - 'qualification/online-hybrid-v1-resource-calibration.json'
      - 'qualification/online-hybrid-v1-resource-observations.json'
      - 'qualification/replay-history-sources.json'
      - 'qualification/resource-profile-catalog-v1.json'
      - 'qualification/resource-profile-catalog-v1-j7-baseline.json'
      - 'qualification/online-engine-opt-v2-j7-baseline.json'
      - 'config/allfather.online-hybrid-v2.validation-j7-baseline.json'
      - 'qualification/adaptive-clock-v1.json'
      - 'qualification/work-grant-scheduler-v1.json'
      - 'qualification/adaptive-resource-allocation-v1.json'
      - 'qualification/j10-*.json'
      - 'qualification/online-engine-opt-v2.json'
      - 'qualification/online-hybrid-v2.json'
      - 'qualification/online-hybrid-v2-candidate.json'
      - 'qualification/online-hybrid-v2-b4.json'
      - 'qualification/online-hybrid-v2-candidate-witnesses.json'
      - 'qualification/g3-candidate-discovery-source.json'
      - 'qualification/local-full-game-v2.json'
      - 'qualification/local-full-game-v2-candidate.json'
      - 'qualification/local-full-game-orchestrated-v1.json'
      - 'config/allfather.online-engine-opt-v2.json'
      - 'config/allfather.online-engine-opt-v2.candidate.json'
      - 'config/allfather.m14-j-j8.validation.json'
      - 'config/allfather.m14-j-j9.validation.json'
      - 'config/allfather.m14-j-j10.validation.json'
      - 'config/allfather.orchestrated-v1.validation.json'
      - 'config/allfather.online-hybrid-v2.validation.json'
      - 'config/allfather.online-hybrid-v2.candidate.validation.json'
      - 'controller/**'
      - 'adapters/process/**'
      - 'adapters/resource/**'
      - 'tools/engine_opt/**'
      - 'tools/local_game/**'
      - 'scripts/engine-opt-*.py'
      - 'scripts/build-online-engine-opt-v2.sh'
      - 'scripts/qualify-engine-opt-v2.py'
      - 'scripts/qualify-engine-opt-evidence.py'
      - 'scripts/qualify-engine-opt-v2-promotion-gate.py'
      - 'scripts/qualify-adaptive-time.py'
      - 'scripts/adaptive-time-contract.py'
      - 'scripts/qualify-work-grant-scheduler.py'
      - 'scripts/work-grant-contract.py'
      - 'scripts/qualify-adaptive-resource-allocator.py'
      - 'scripts/adaptive-resource-contract.py'
      - 'scripts/validate-resource-orchestration.py'
      - 'scripts/qualify-resource-orchestration.py'
      - 'scripts/collect-j10-staged-calibration.py'
      - 'scripts/build-j10-allocation-calibration.py'
      - 'scripts/qualify-online-hybrid-v2.py'
      - 'scripts/qualify-online-hybrid-v2-candidate.py'
      - 'scripts/qualify-online-hybrid-v2-b4.py'
      - 'scripts/qualify-engine-opt-v2-candidate.py'
      - 'tests/engine_opt/**'
      - 'tests/controller/test_engine_opt_runtime.py'
      - 'tests/controller/test_adaptive_time.py'
      - 'tests/controller/test_move_resource_plan.py'
      - 'tests/controller/test_work_grant.py'
      - 'tests/controller/test_work_scheduler.py'
      - 'tests/controller/test_resource_allocator.py'
      - 'tests/controller/test_adaptive_resource_router.py'
      - 'tests/controller/test_allocation_features.py'
      - 'tests/controller/test_orchestration_integrity.py'
      - 'tests/controller/test_orchestrated_authority.py'
      - 'tests/controller/test_resource_profile_catalog.py'
      - 'tests/controller/test_runtime_profiles.py'
      - 'tests/controller/test_resource_control.py'
      - 'tests/adapters/test_linux_affinity.py'
      - 'tests/fixtures/engine_opt/**'
      - 'tests/fixtures/j10/**'
      - 'tests/harness/uci_session.py'
      - 'Makefile'
      - 'Makefile.local-game'
      - 'scripts/ci-install-apt-deps.sh'
      - 'tests/ci/test_apt_installer.py'
      - '.github/workflows/engine-optimization.yml'

permissions:
  contents: read

env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ALLFATHER_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

concurrency:
  group: engine-opt-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      impact: ${{ steps.classify.outputs.impact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
          fetch-depth: 0
      - id: classify
        name: Classify legacy qualification impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            impact="runtime_affected"
          else
            git fetch --no-tags origin "$BASE_SHA"
            mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$ALLFATHER_SOURCE_SHA")
            impact="$(python3 scripts/classify-qualification-impact.py --base-sha "$BASE_SHA" "${paths[@]}")"
          fi
          echo "impact=$impact" | tee -a "$GITHUB_OUTPUT"

  control-plane-contracts:
    needs: impact
    if: ${{ needs.impact.outputs.impact == 'control_plane_only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Validate J2 host-observation contracts
        run: make orchestration-host-tests

  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Static contracts
        run: |
          python3 -m compileall -q controller adapters tools scripts tests/engine_opt tests/controller/test_engine_opt_runtime.py
          python3 tests/engine_opt/test_contracts.py
          python3 tests/engine_opt/test_ab.py
          python3 tests/engine_opt/test_execution_domain.py
          python3 tests/engine_opt/test_matrix_qualification.py
          python3 tests/engine_opt/test_matrix_scope.py
          python3 tests/engine_opt/test_aggregate_paths.py
          python3 tests/ci/test_apt_installer.py
          python3 tests/engine_opt/test_g3_witness_extractor.py
          python3 tests/engine_opt/test_g3_b4.py
          python3 tests/engine_opt/test_constituent_hash.py
          python3 tests/engine_opt/test_legacy_calibration_reconciliation.py
          python3 tests/engine_opt/test_candidate_gate.py
          python3 tests/engine_opt/test_promotion_gate.py
          python3 tests/controller/test_partition_versions.py
          python3 -m json.tool qualification/constituent-benchmark-v2.json >/dev/null
          python3 -m json.tool qualification/online-hybrid-v1-resource-calibration.json >/dev/null
          python3 -m json.tool qualification/online-hybrid-v1-resource-observations.json >/dev/null
          python3 -m json.tool qualification/replay-history-sources.json >/dev/null
          python3 scripts/validate-online-hybrid-resource-calibration.py
          python3 tests/controller/test_engine_opt_runtime.py
          python3 tests/controller/test_move_resource_plan.py
          python3 tests/controller/test_adaptive_time.py
          python3 scripts/qualify-adaptive-time.py
          python3 -m py_compile scripts/adaptive-time-contract.py
          python3 tests/controller/test_work_grant.py
          python3 tests/controller/test_work_scheduler.py
          python3 scripts/qualify-work-grant-scheduler.py
          python3 -m py_compile scripts/work-grant-contract.py
          python3 scripts/collect-j10-staged-calibration.py
          python3 scripts/build-j10-allocation-calibration.py
          python3 tests/controller/test_resource_allocator.py
          python3 tests/controller/test_adaptive_resource_router.py
          python3 tests/controller/test_allocation_features.py
          python3 tests/controller/test_orchestration_integrity.py
          python3 tests/controller/test_orchestrated_authority.py
          python3 scripts/qualify-adaptive-resource-allocator.py
          python3 scripts/qualify-resource-orchestration.py --static
          python3 -m py_compile scripts/adaptive-resource-contract.py scripts/validate-resource-orchestration.py
          python3 tests/controller/test_resource_profile_catalog.py
          python3 tests/controller/test_runtime_profiles.py
          python3 tests/adapters/test_linux_affinity.py
          python3 tests/controller/test_resource_control.py
          python3 -m py_compile scripts/qualify-engine-opt-evidence.py scripts/qualify-engine-opt-v2-candidate.py scripts/qualify-engine-opt-v2-candidate-gate.py scripts/qualify-engine-opt-v2-promotion-gate.py scripts/qualify-engine-opt-matrix.py scripts/qualify-online-hybrid-v2-candidate.py scripts/extract-g3-candidate-witnesses.py tools/engine_opt/matrix_qualification.py tools/engine_opt/candidate_gate.py tools/engine_opt/promotion_gate.py
          python3 scripts/qualify-online-hybrid-v2.py --static
          python3 scripts/qualify-online-hybrid-v2-candidate.py --static
          python3 scripts/qualify-online-hybrid-v2-b4.py --static
          for f in qualification/resource-profile-catalog-v1.json qualification/resource-profile-catalog-v1-j7-baseline.json qualification/online-engine-opt-v2-j7-baseline.json qualification/adaptive-clock-v1.json qualification/work-grant-scheduler-v1.json qualification/adaptive-resource-allocation-v1.json qualification/j10-calibration-source-v1.json qualification/j10-calibration-corpus-v1.json qualification/j10-staged-decision-model-v1.json qualification/j10-regime-support-model-v1.json qualification/engine-opt-v2.json qualification/engine-opt-v2-selection.json qualification/engine-opt-v2-evidence.json qualification/engine-opt-v2-host-binding.json qualification/engine-opt-v2-candidate-selection.json qualification/engine-opt-v2-candidate-evidence.json qualification/engine-opt-v2-candidate-native-work-policy.json qualification/engine-opt-v2-native-work-policy.json qualification/engine-derived-lock.json qualification/online-engine-opt-v2.json qualification/online-hybrid-v2.json qualification/online-hybrid-v2-candidate.json qualification/online-hybrid-v2-candidate-witnesses.json qualification/g3-candidate-discovery-source.json qualification/local-full-game-v2.json qualification/local-full-game-v2-candidate.json qualification/local-full-game-orchestrated-v1.json config/allfather.online-engine-opt-v2.json config/allfather.online-engine-opt-v2.candidate.json config/allfather.m14-j-j8.validation.json config/allfather.m14-j-j9.validation.json config/allfather.m14-j-j10.validation.json config/allfather.orchestrated-v1.validation.json config/allfather.online-hybrid-v2.validation.json config/allfather.online-hybrid-v2.validation-j7-baseline.json config/allfather.online-hybrid-v2.candidate.validation.json; do python3 -m json.tool "$f" >/dev/null; done
          bash -n scripts/build-online-engine-opt-v2.sh

  build-candidate:
    needs: impact
    if: ${{ needs.impact.outputs.impact != 'control_plane_only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        timeout-minutes: 5
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev
      - name: Cache networks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
            build/artifacts/lc0
          key: engine-opt-v2-networks-${{ runner.os }}-${{ hashFiles('vendor.lock.json','qualification/lc0-strength.lock.json') }}
      - name: Build candidate bundle
        run: make build-online-engine-opt-v2
      - name: Qualify candidate identity
        run: python3 scripts/qualify-engine-opt-v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-opt-v2-candidate
          path: |
            build/online-engine-opt-v2
            build/test-results/engine-opt-v2
          if-no-files-found: error
          retention-days: 14

  constituent-ab:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        timeout-minutes: 5
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-opt-v2-candidate
          path: build/candidate-download
      - name: Restore candidate executable bits
        timeout-minutes: 5
        run: chmod +x build/candidate-download/online-engine-opt-v2/bin/*
      - name: Install constituent build dependencies
        timeout-minutes: 5
        run: |
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev
      - name: Checkout pristine LC0 control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/lc0
          ref: 1322b362b09db5eb0830e726f5734d44119a1b46
          path: build/pristine-lc0
          fetch-depth: 1
          persist-credentials: false
      - name: Verify pristine LC0 identity
        run: |
          test "$(git -C build/pristine-lc0 rev-parse HEAD)" = "1322b362b09db5eb0830e726f5734d44119a1b46"
          test "$(git -C build/pristine-lc0 rev-parse HEAD^{tree})" = "c7ca6fd1558acd38a19202eaaf52946b14b2bc64"
      - name: Build pristine LC0 with reference BLAS flags
        run: |
          cd build/pristine-lc0
          ./build.sh release             -Dbuild_backends=true -Dblas=true -Dplain_cuda=false -Dcudnn=false             -Dopencl=false -Donnx=false -Dmetal=disabled -Dsycl=off -Dhip=false             -Dgtest=false -Db_lto=false -Dnative_arch=false -Dispc=false             -Dispc_native_only=false -Dpopcnt=false -Df16c=false -Dpext=false
      - name: Checkout pristine Reckless control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/Reckless
          ref: 31d9cd6fd2bea6d9f72eeb35e0bac70daa295fb1
          path: build/pristine-reckless
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and build pristine Reckless
        run: |
          test "$(git -C build/pristine-reckless rev-parse HEAD)" = "31d9cd6fd2bea6d9f72eeb35e0bac70daa295fb1"
          test "$(git -C build/pristine-reckless rev-parse HEAD^{tree})" = "88763d8e81ea45b938403f7f4feee990ad244c2d"
          NET="$PWD/build/candidate-download/online-engine-opt-v2/networks/v60-7f587dfb.nnue"
          cd build/pristine-reckless
          EVALFILE="$NET" CARGO_ENCODED_RUSTFLAGS='-Ctarget-cpu=x86-64'             cargo build --release --no-default-features --target x86_64-unknown-linux-gnu
      - name: Build non-PGO Stockfish control from same source
        run: |
          NET="$PWD/build/candidate-download/online-engine-opt-v2/networks/nn-134a887f4c8f.nnue"
          ln -sfn "$NET" engines/stockfish/src/nn-134a887f4c8f.nnue
          make -C engines/stockfish/src ARCH=x86-64 objclean
          make -C engines/stockfish/src -j2 build ARCH=x86-64
          cp engines/stockfish/src/stockfish build/stockfish-no-pgo
      - name: Run constituent A/B benchmarks
        run: |
          mkdir -p build/test-results/engine-opt-ab
          python3 scripts/engine-opt-ab.py             --family lc0             --left build/candidate-download/online-engine-opt-v2/bin/lc0             --left-label allfather-derived             --right build/pristine-lc0/build/release/lc0             --right-label pristine-upstream             --weights build/candidate-download/online-engine-opt-v2/networks/791556.pb.gz             --nodes 64 --warmup-nodes 64             --output build/test-results/engine-opt-ab/lc0-derived-vs-pristine.json
          python3 scripts/engine-opt-ab.py             --family reckless             --left build/candidate-download/online-engine-opt-v2/bin/reckless             --left-label allfather-derived             --right build/pristine-reckless/target/x86_64-unknown-linux-gnu/release/reckless             --right-label pristine-upstream             --nodes 200000             --output build/test-results/engine-opt-ab/reckless-derived-vs-pristine.json
          python3 scripts/engine-opt-ab.py             --family stockfish             --left build/candidate-download/online-engine-opt-v2/bin/stockfish             --left-label pgo             --right build/stockfish-no-pgo             --right-label no-pgo             --nodes 200000             --output build/test-results/engine-opt-ab/stockfish-pgo-vs-no-pgo.json
          python3 scripts/engine-opt-hash-matrix.py             --family stockfish             --binary build/candidate-download/online-engine-opt-v2/bin/stockfish             --nodes 200000             --output build/test-results/engine-opt-ab/stockfish-hash-matrix.json
          python3 scripts/engine-opt-hash-matrix.py             --family reckless             --binary build/candidate-download/online-engine-opt-v2/bin/reckless             --nodes 200000             --output build/test-results/engine-opt-ab/reckless-hash-matrix.json
      - name: Qualify repeated constituent hash evidence before lifecycle
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.engine_opt.constituent_hash import load_policy, qualify_hash_matrix
          policy=load_policy()
          source=os.environ["ALLFATHER_SOURCE_SHA"]
          selected={"stockfish":16,"reckless":16}
          for family in ("stockfish","reckless"):
              path=Path(f"build/test-results/engine-opt-ab/{family}-hash-matrix.json")
              doc=json.loads(path.read_text(encoding="utf-8"))
              result=qualify_hash_matrix(
                  doc,
                  expected_source_commit=source,
                  selected_hash_mb=selected[family],
                  policy=policy,
              )
              print(f"{family}: {json.dumps(result, sort_keys=True)}")
              if result["qualified"] is not True:
                  raise SystemExit(
                      f"{family} repeated hash qualification: {result['disposition']}"
                  )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-opt-v2-constituent-ab
          path: build/test-results/engine-opt-ab
          if-no-files-found: warn
          retention-days: 14

  fastchess-source-tests-v2:
    needs: impact
    if: ${{ needs.impact.outputs.impact != 'control_plane_only' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Match pinned Fastchess source-test host
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          g++ --version
      - name: Run pinned Fastchess source tests
        run: |
          python3 -m tools.local_game.build_fastchess \
            --source-test-only \
            --attestation build/fastchess-source-test/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-opt-v2-fastchess-source-test
          path: build/fastchess-source-test/attestation.json
          if-no-files-found: error
          retention-days: 14

  profile-domain-qualification:
    needs: [impact, build-candidate, fastchess-source-tests-v2, constituent-ab]
    if: ${{ needs.impact.outputs.impact != 'control_plane_only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout and bind runner environment
        run: |
          test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
          echo "ALLFATHER_RUNNER_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-opt-v2-candidate
          path: build/candidate-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-opt-v2-fastchess-source-test
          path: build/fastchess-source-test
      - name: Restore exact v2 candidate bundle
        timeout-minutes: 5
        run: |
          test -d build/candidate-download/online-engine-opt-v2
          rm -rf build/online-engine-opt-v2
          mv build/candidate-download/online-engine-opt-v2 build/online-engine-opt-v2
          chmod +x build/online-engine-opt-v2/bin/*
      - name: Install one shared qualification substrate
        timeout-minutes: 5
        run: |
          bash scripts/ci-install-apt-deps.sh build-essential git meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev python3-pip python3-setuptools python3-wheel
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps \
            --require-hashes -r qualification/local-game-requirements.txt
      - name: Capture one canonical execution domain
        run: |
          mkdir -p build/test-results/engine-opt-v2-profile-domain
          python3 scripts/lc0-hardware-probe.py \
            > build/test-results/engine-opt-v2-profile-domain/host-probe.json
          python3 -m tools.engine_opt.domain capture \
            --probe build/test-results/engine-opt-v2-profile-domain/host-probe.json \
            --output build/test-results/engine-opt-v2-profile-domain/execution-domain.json
          python3 -m tools.engine_opt.domain validate \
            --input build/test-results/engine-opt-v2-profile-domain/execution-domain.json \
            --expected-source-commit "$ALLFATHER_SOURCE_SHA"
      - name: Run canonical LC0 matrix on the bound domain
        run: |
          python3 scripts/engine-opt-matrix.py \
            --binary build/online-engine-opt-v2/bin/lc0 \
            --weights build/online-engine-opt-v2/networks/791556.pb.gz \
            --selection qualification/engine-opt-v2-selection.json \
            --qualification-only \
            --execution-domain build/test-results/engine-opt-v2-profile-domain/execution-domain.json \
            --output build/test-results/engine-opt-v2-profile-domain/matrix/canonical-lc0.json
      - name: Exercise J8 MoveResourcePlan on real ENGINE-OPT-V2 processes
        run: python3 scripts/adaptive-time-contract.py
      - name: Exercise J9 WorkGrants on real ENGINE-OPT-V2 processes
        run: python3 scripts/work-grant-contract.py
      - name: Exercise J10 adaptive allocation on real ENGINE-OPT-V2 processes
        run: python3 scripts/adaptive-resource-contract.py
      - name: Exercise J11 independent orchestration evidence
        run: |
          latest="$(
            find build/replays-m14-j-j10 -mindepth 1 -maxdepth 1 -type d \
              | sort \
              | tail -n 1
          )"
          test -n "$latest"
          mkdir -p build/test-results/engine-opt-v2-profile-domain/j11
          rm -rf build/test-results/engine-opt-v2-profile-domain/j11/replay
          cp -a "$latest" build/test-results/engine-opt-v2-profile-domain/j11/replay
          python3 scripts/validate-resource-orchestration.py \
            --run-dir build/test-results/engine-opt-v2-profile-domain/j11/replay \
            --expected-source-commit "$ALLFATHER_SOURCE_SHA" \
            --output build/test-results/engine-opt-v2-profile-domain/j11/report.json
      - name: Exercise J12 orchestrated composition fail-closed authority
        env:
          ALLFATHER_EXECUTION_DOMAIN_PATH: build/test-results/engine-opt-v2-profile-domain/execution-domain.json
        run: python3 scripts/qualify-resource-orchestration.py --record-disposition
      - name: Build pinned Fastchess against source-test attestation
        run: make -f Makefile.local-game build-fastchess
      - name: Run LOCAL-1 contract regressions
        run: make -f Makefile.local-game test
      - name: Qualify G3-v2 and LOCAL-1-v2 on the same bound worker
        run: |
          python3 -m tools.local_game.runner \
            --mode required \
            --policy qualification/local-full-game-v2.json \
            --execution-domain build/test-results/engine-opt-v2-profile-domain/execution-domain.json \
            --output build/test-results/engine-opt-v2-profile-domain/canonical-local1/campaign
      - name: Qualify J12 orchestrated lifecycle on the same bound worker
        run: |
          python3 -m tools.local_game.runner \
            --mode required \
            --policy qualification/local-full-game-orchestrated-v1.json \
            --execution-domain build/test-results/engine-opt-v2-profile-domain/execution-domain.json \
            --output build/test-results/engine-opt-v2-profile-domain/j12-local1/campaign
      - name: Bind promoted canonical profile to the exact-head engine bundle
        run: |
          python3 scripts/qualify-engine-opt-v2.py
          mkdir -p build/test-results/engine-opt-v2-profile-domain/canonical
          cp build/test-results/engine-opt-v2/report.json \
            build/test-results/engine-opt-v2-profile-domain/canonical/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-opt-v2-profile-domain
          path: build/test-results/engine-opt-v2-profile-domain
          if-no-files-found: error
          retention-days: 14

  aggregate-qualification:
    needs:
      - static-contracts
      - build-candidate
      - constituent-ab
      - profile-domain-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
          fetch-depth: 2
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Fetch PR base for canonical surface guard
        if: ${{ env.ALLFATHER_BASE_SHA != '' }}
        run: git fetch --no-tags --depth=1 origin "$ALLFATHER_BASE_SHA"
      - name: Observe promotion ancestry; gate seals any missing-object failure
        continue-on-error: true
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}'
          git rev-parse --verify 'HEAD^'
          if [ -n "$ALLFATHER_BASE_SHA" ]; then
            test "$(git rev-parse --verify "$ALLFATHER_BASE_SHA^{commit}")" = "$ALLFATHER_BASE_SHA"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: engine-opt-v2-*
          path: build/engine-opt-artifacts
          merge-multiple: false
      - name: Qualify canonical LC0 matrix independently
        run: |
          python3 scripts/qualify-engine-opt-matrix.py \
            --root build/engine-opt-artifacts \
            --selection qualification/engine-opt-v2-selection.json \
            --candidate-report-pattern 'engine-opt-v2-profile-domain/**/canonical/report.json' \
            --output build/test-results/engine-opt-v2-canonical-matrix/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-opt-v2-canonical-matrix
          path: build/test-results/engine-opt-v2-canonical-matrix
          if-no-files-found: error
          retention-days: 14
      - name: Aggregate exact-head canonical b4 evidence
        run: |
          python3 scripts/qualify-engine-opt-evidence.py \
            --root build/engine-opt-artifacts \
            --selection qualification/engine-opt-v2-selection.json \
            --candidate-report-pattern 'engine-opt-v2-profile-domain/**/canonical/report.json' \
            --output build/test-results/engine-opt-v2-aggregate/report.json
      - name: Summarize canonical b4 disposition
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path=Path("build/test-results/engine-opt-v2-aggregate/report.json")
          print("## ENGINE-OPT-V2 canonical b4 aggregate")
          if not path.is_file():
              print("\nCanonical aggregate report was not produced.")
          else:
              report=json.loads(path.read_text(encoding="utf-8"))
              for label,key in (
                  ("Evidence valid","evidence_valid"),
                  ("Profile qualified","profile_qualified"),
                  ("Passed","passed"),
                  ("Disposition","qualification_disposition"),
              ):
                  print(f"- **{label}:** `{report.get(key)}`")
              invalid=report.get("invalid_evidence") or []
              if invalid:
                  print("\n### Invalid evidence")
                  for issue in invalid:
                      print(f"- {issue}")
              failures=report.get("qualification_failures") or []
              if failures:
                  print("\n### Qualification failures")
                  for row in failures:
                      print(f"- `{row.get('code')}`: {row.get('message')}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-opt-v2-aggregate
          path: build/test-results/engine-opt-v2-aggregate
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate canonical b4 promotion gate
        id: promotion_gate
        run: |
          python3 scripts/qualify-engine-opt-v2-promotion-gate.py \
            --aggregate build/test-results/engine-opt-v2-aggregate/report.json \
            --host-binding qualification/engine-opt-v2-host-binding.json \
            --catalog qualification/resource-profile-catalog-v1.json \
            --base-sha "$ALLFATHER_BASE_SHA" \
            --output build/test-results/engine-opt-v2-promotion-gate/report.json
      - name: Summarize canonical b4 promotion gate
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path=Path("build/test-results/engine-opt-v2-promotion-gate/report.json")
          print("\n## ENGINE-OPT-V2 canonical b4 promotion gate")
          if not path.is_file():
              print("\nPromotion gate report was not produced.")
          else:
              report=json.loads(path.read_text(encoding="utf-8"))
              print(f"- **Passed:** `{report.get('passed')}`")
              print(f"- **Disposition:** `{report.get('disposition')}`")
              failure=report.get('failure') or {}
              if failure:
                  print(f"- **Blocking reason:** `{failure.get('message')}`")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (steps.promotion_gate.outcome == 'success' || steps.promotion_gate.outcome == 'failure') }}
        with:
          name: engine-opt-v2-promotion-gate
          path: build/test-results/engine-opt-v2-promotion-gate
          if-no-files-found: error
          retention-days: 14

