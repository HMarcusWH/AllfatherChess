name: M14-J J13 META-1 matched authority control

on:
  pull_request:
    paths:
      - 'controller/**'
      - 'tools/meta1/**'
      - 'tools/local_game/**'
      - 'scripts/qualify-meta-1.py'
      - 'qualification/meta-1-v1.json'
      - 'tests/meta1/**'
      - 'tests/fixtures/meta1/**'
      - 'Makefile.local-game'
      - '.github/workflows/meta-1.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label for the real META-1 campaign (use a J12-qualified host)'
        required: true
        default: 'ubuntu-24.04'

permissions:
  contents: read

env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: meta1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Compile and validate META-1 contracts
        run: |
          python3 -m compileall -q tools/meta1 scripts/qualify-meta-1.py tests/meta1 tests/controller/test_meta1_anchor_control.py
          python3 -m json.tool qualification/meta-1-v1.json >/dev/null
          make -f Makefile.local-game meta1-tests

  fastchess-source-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Run pinned Fastchess source tests
        run: python3 -m tools.local_game.build_fastchess --source-test-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta1-fastchess-source-test
          path: build/fastchess-source-test/attestation.json
          if-no-files-found: error
          retention-days: 14

  campaign:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [static-contracts, fastchess-source-tests]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout and bind runner environment
        run: |
          test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
          echo "ALLFATHER_RUNNER_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta1-fastchess-source-test
          path: build/fastchess-source-test
      - name: Install build and campaign dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential git meson ninja-build pkg-config             libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev             python3-pip python3-setuptools python3-wheel
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps             --require-hashes -r qualification/local-game-requirements.txt
      - name: Build exact-head ENGINE-OPT-V2 bundle
        run: |
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
      - name: Capture canonical execution domain
        run: |
          mkdir -p build/test-results/engine-opt-v2-profile-domain
          python3 scripts/lc0-hardware-probe.py             > build/test-results/engine-opt-v2-profile-domain/host-probe.json
          python3 -m tools.engine_opt.domain capture             --probe build/test-results/engine-opt-v2-profile-domain/host-probe.json             --output build/test-results/engine-opt-v2-profile-domain/execution-domain.json
          python3 -m tools.engine_opt.domain validate             --input build/test-results/engine-opt-v2-profile-domain/execution-domain.json             --expected-source-commit "$ALLFATHER_SOURCE_SHA"
      - name: Gate META-1 on real J12 authority qualification
        env:
          ALLFATHER_EXECUTION_DOMAIN_PATH: build/test-results/engine-opt-v2-profile-domain/execution-domain.json
        run: python3 scripts/qualify-resource-orchestration.py --record-disposition
      - name: Build pinned Fastchess
        run: make -f Makefile.local-game build-fastchess
      - name: Run META-1 or retain non-qualified host disposition
        run: |
          python3 -m tools.meta1.runner             --j12-report build/test-results/engine-opt-v2-profile-domain/j12/report.json             --output build/test-results/meta1/campaign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meta1-v1
          path: |
            build/test-results/meta1
            build/test-results/engine-opt-v2-profile-domain/j12
          if-no-files-found: error
          retention-days: 30
