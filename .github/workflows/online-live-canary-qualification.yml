name: ONLINE-PLAY-1 restricted Lichess dry-run (NO LIVE API)

on:
  pull_request:
    paths:
      - 'deploy/lichess/**'
      - 'deploy/live_canary/**'
      - 'qualification/**'
      - 'scripts/check-live-canary-boundary.py'
      - 'scripts/qualify-live-canary-host.py'
      - 'scripts/run-live-canary-dry-run.py'
      - 'scripts/verify-online-live-canary.py'
      - 'tests/lichess/**'
      - 'tests/release/**'
      - 'docs/ONLINE_LIVE_CANARY.md'
      - 'docs/ONLINE_LIVE_CANARY_THREAT_MODEL.md'
      - '.github/workflows/online-live-canary-qualification.yml'
      - 'controller/**'
      - 'engines/**'
      - 'config/**'
      - 'vendor.lock.json'
  # Deliberately NO workflow_dispatch, push, production environment or secrets.
permissions:
  contents: read
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
concurrency:
  group: online-play-1-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Fast source and offline prohibition checks
        run: |
          set -euo pipefail
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 -m compileall -q deploy/lichess deploy/live_canary tests/lichess scripts
          python3 -m json.tool qualification/online-live-canary-v1.json >/dev/null
          python3 -m json.tool qualification/schemas/online-live-canary-v1.schema.json >/dev/null
          python3 -m json.tool qualification/schemas/online-live-admission-v1.schema.json >/dev/null
          python3 scripts/check-live-canary-boundary.py --output build/test-results/online-play-1/source-boundary.json
          python3 -m unittest tests.release.test_live_release_boundary -v
          python3 scripts/release-promotion-policy.py --output build/test-results/online-play-1/release-prohibition.json
      - name: Retain ONLY policy checks, never key or image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-source-boundary
          path: |
            build/test-results/online-play-1/source-boundary.json
            build/test-results/online-play-1/release-prohibition.json
          if-no-files-found: warn
          retention-days: 14

  gateway-unit:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - run: |
          set -euo pipefail
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 -m unittest tests.lichess.test_live_gateway tests.lichess.test_live_canary_redaction -v

  bridge-supervisor-unit:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - run: |
          set -euo pipefail
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 deploy/lichess/fetch_bridge.py
          python3 -m unittest tests.lichess.test_live_bridge_policy tests.lichess.test_live_canary_supervisor -v
          python3 -m unittest discover -s tests/lichess -p 'test_*.py' -v

  network-integration:
    needs: [gateway-unit, bridge-supervisor-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Build real three-engine sealed UCI with unchanged controller
        timeout-minutes: 40
        run: |
          set -euo pipefail
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev python3-pip python3-venv
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
          python3 scripts/release-manifest.py create
          python3 scripts/release-manifest.py verify
          python3 scripts/package-online.py
          python3 dist/online3a-stage/deploy/bin/allfather-online --check
      - name: Prepare pinned upstream and exact source-locked wheelhouse
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 deploy/lichess/fetch_bridge.py
          mkdir -p build/online3b-wheels
          python3 scripts/verify-release-python-lock.py
          python3 scripts/prepare-online3b-wheels.py --source-lock deploy/lichess/requirements.release.lock --wheelhouse build/online3b-wheels
          python3 scripts/verify-release-python-lock.py --wheelhouse build/online3b-wheels
      - name: Build only local, synthetic Docker images (NEVER push)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker build -f deploy/lichess/Dockerfile.offline -t allfather-online4b-offline:pr-a-test .
          docker build -f deploy/live_canary/Dockerfile.test --build-arg BASE_IMAGE=allfather-online4b-offline:pr-a-test -t allfather-canary-test:private .
          docker image inspect allfather-canary-test:private --format '{{.Id}}'
      - name: Play a real sealed Allfather game against fake API as WHITE
        timeout-minutes: 17
        run: |
          python3 scripts/run-live-canary-dry-run.py --color white --image allfather-canary-test:private --source-sha "$HEAD_SHA" --output build/test-results/online-play-1/white
      - name: Play a real sealed Allfather game against fake API as BLACK
        timeout-minutes: 17
        run: |
          python3 scripts/run-live-canary-dry-run.py --color black --image allfather-canary-test:private --source-sha "$HEAD_SHA" --output build/test-results/online-play-1/black
      - name: Retain sanitized HTTP/journal/PGN only; NEVER image/secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-fake-games
          path: |
            build/test-results/online-play-1/white/integration.json
            build/test-results/online-play-1/white/gateway/server.json
            build/test-results/online-play-1/white/gateway/gateway-state.json
            build/test-results/online-play-1/white/bridge/report.json
            build/test-results/online-play-1/black/integration.json
            build/test-results/online-play-1/black/gateway/server.json
            build/test-results/online-play-1/black/gateway/gateway-state.json
            build/test-results/online-play-1/black/bridge/report.json
          if-no-files-found: error
          retention-days: 14

  independent-canary-verdict:
    needs: [source-boundary, gateway-unit, bridge-supervisor-unit, network-integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install independent PGN/legal replay oracle
        run: |
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages 'chess==1.11.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: online-play-1-fake-games
          path: build/test-results/online-play-1
      - name: Source-independent read-only verifier, neither producer's PASS nor tests
        run: |
          set -euo pipefail
          python3 scripts/check-live-canary-boundary.py
          python3 scripts/verify-online-live-canary.py \
            --policy qualification/online-live-canary-v1.json \
            --evidence build/test-results/online-play-1 \
            --source-sha "$HEAD_SHA" --mode offline-dry-run \
            --output build/test-results/online-play-1/independent-verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: online-play-1-independent-verdict
          path: build/test-results/online-play-1/independent-verdict.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    needs: [source-boundary, gateway-unit, bridge-supervisor-unit,
            network-integration, independent-canary-verdict]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: No skipped/unverified success promotion
        env:
          JOB_CONTEXT: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          needs=json.loads(os.environ['JOB_CONTEXT'])
          print('## ONLINE-PLAY-1 — PR-A fake API only' )
          print('No Lichess credentials, Bot API calls, account upgrade, deployment or release.')
          bad=[(name,value.get('result')) for name,value in needs.items()
               if value.get('result')!='success']
          print('Job results:',{k:v.get('result') for k,v in needs.items()})
          if bad:
              print('NOT QUALIFIED: '+repr(bad))
              sys.exit(2)
          PY
