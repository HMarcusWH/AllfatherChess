name: ONLINE-1 development transport
on:
  push:
    branches: [feat/online-clock-deadlines]
    paths: [.github/workflows/online1-transport.yml]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e8923ea9e1fcceb4165279a53df7cb47ddd47bee
          persist-credentials: false
      - name: Materialize exact patch without executing proposed code or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request, zlib
          from pathlib import Path
          root = Path('/tmp/online1-transport')
          root.mkdir()
          repo = 'https://api.github.com/repos/HMarcusWH/AllfatherChess'
          def api(path, data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
              req = urllib.request.Request(repo + path, data=None if data is None else json.dumps(data).encode(), headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def git_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          uploaded = ['d0e3f240c97088b313d6c4c2d5c3bdca54c07d53', '4ddbfa21324e96553e6d098ee2600559d7156603', 'b541b76a6fea3f5b33986fbf79262304774c5af4', '9a26ca57c856e3927144ccc468a44d3606c1c15a', 'b6f8d3ce87a26a2e162e84e405717fb1066152f3', '8a2b9667a6f0151ab928cca7a5f5e8004bcbdfba', '176c7002d42d368d40a9c05e161fa5c8215e8a0b', 'e1e8c10015597874fdc9c7f4e98cb7984d635da4']
          expected = ['e193837eedd7d62468f596017850d18e1686447b', '4ddbfa21324e96553e6d098ee2600559d7156603', 'b541b76a6fea3f5b33986fbf79262304774c5af4', 'fa6f9d1180067e74a2f7a1d6b0c543786ca20bd5', 'a46655e8bf3f78df6974b343de6c47087e139810', '8a2b9667a6f0151ab928cca7a5f5e8004bcbdfba', '176c7002d42d368d40a9c05e161fa5c8215e8a0b', 'e1e8c10015597874fdc9c7f4e98cb7984d635da4']
          repairs = {0: [[1350,1354,''],[1948,1949,''],[2020,2021,'9+'],[2113,2115,''],[2661,2663,'']], 3: [[2963,2964,''],[3111,3113,''],[5864,5864,'9'],[8001,8004,'U']], 4: [[981,982,''],[8000,8000,'8']]}
          chunks = []
          for i, sha in enumerate(uploaded):
              data = base64.b64decode(api('/git/blobs/' + sha)['content'])
              assert git_sha(data) == sha
              encoded = base64.b64encode(data).decode()
              for start, end, replacement in reversed(repairs.get(i, [])):
                  encoded = encoded[:start] + replacement + encoded[end:]
              data = base64.b64decode(encoded, validate=True)
              assert git_sha(data) == expected[i], ('part checksum', i)
              chunks.append(data)
          patch = zlib.decompress(b''.join(chunks))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '2b73a4e114ea068dc9e1c4eda76540d21ac7536716534b1a499236022b77c2f2', digest
          patch_path = root / 'changes.diff'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(patch_path)], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          elements = []
          for path in filter(None, paths):
              assert not path.startswith(('engines/', 'tests/baseline/golden/')) and path != 'vendor.lock.json', path
              entry = subprocess.check_output(['git', 'ls-files', '-s', '--', path]).decode().split()
              data = Path(path).read_bytes()
              expected_blob = git_sha(data)
              assert expected_blob == entry[1]
              created = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert created['sha'] == expected_blob
              elements.append({'path': path, 'mode': entry[0], 'type': 'blob', 'sha': expected_blob})
          (root / 'tree-elements.json').write_text(json.dumps(elements, indent=2) + '\n')
          (root / 'provenance.json').write_text(json.dumps({'base': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'patch_sha256': digest, 'changed_files': len(elements), 'ref_writes': False, 'proposed_code_executed': False}, indent=2) + '\n')
          print(json.dumps(elements, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online1-transport
          path: /tmp/online1-transport/
          retention-days: 1
