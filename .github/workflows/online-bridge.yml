name: ONLINE-3B pinned offline bridge (qualification)
on:
  pull_request:
    paths:
      - 'deploy/lichess/**'
      - 'tests/lichess/**'
      - 'scripts/qualify-online-bridge.py'
      - 'scripts/prepare-online3b-wheels.py'
      - 'qualification/online-bridge-v1.json'
      - '.github/workflows/online-bridge.yml'
      - 'Makefile'
      - 'docs/ONLINE_3B_BRIDGE_QUALIFICATION.md'
      - 'controller/**'
      - 'common/**'
      - 'adapters/**'
      - 'config/**'
      - 'engines/**'
      - 'vendor.lock.json'
  workflow_dispatch:
permissions:
  contents: read
env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: online3b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Confirm exact source
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Prepare dependency hash lock candidate
        run: |
          bash scripts/ci-install-apt-deps.sh python3-pip python3-venv
          python3 -m pip install --break-system-packages 'pip-tools==7.5.2'
          mkdir -p build/online3b
          python3 -m piptools compile --generate-hashes \
            --output-file build/online3b/requirements.lock deploy/lichess/requirements.in
          python3 -m pip install --break-system-packages --require-hashes \
            -r build/online3b/requirements.lock
          mkdir -p build/online3b/wheels
          python3 -m pip download --no-deps --require-hashes \
            -r build/online3b/requirements.lock -d build/online3b/wheels
          sha256sum build/online3b/wheels/* | tee build/online3b/wheel-hashes.txt
      - name: Fetch and verify pinned upstream
        run: python3 deploy/lichess/fetch_bridge.py
      - name: Contract and HTTP failure tests
        run: |
          python3 -m py_compile deploy/lichess/*.py tests/lichess/*.py scripts/qualify-online-bridge.py
          python3 -m unittest discover -s tests/lichess -p 'test_*.py' -v
      - name: Retain dependency lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online3b-resolved-lock-candidate
          path: |
            build/online3b/requirements.lock
            build/online3b/wheel-hashes.txt
          if-no-files-found: warn
          retention-days: 7

  offline-full-games:
    name: offline-full-games
    needs: bridge-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install exact engine toolchain and Python tools
        run: |
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev python3-pip python3-venv
          python3 -m pip install --break-system-packages 'pip-tools==7.5.2'
      - name: Cache immutable engine networks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
            build/artifacts/lc0
          key: online3b-networks-${{ runner.os }}-${{ hashFiles('vendor.lock.json','qualification/lc0-strength.lock.json') }}
      - name: Build, qualify, seal and relocate exact-source Allfather
        timeout-minutes: 35
        run: |
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
          python3 scripts/release-manifest.py create
          python3 scripts/release-manifest.py verify
          python3 scripts/package-online.py
          mkdir -p build/online3b-extract
          tar --no-same-owner -xzf dist/allfather-online3a-offline.tar.gz -C build/online3b-extract
          python3 build/online3b-extract/deploy/bin/allfather-online --check
      - name: Prepare exact wheelhouse and pinned upstream checkout
        timeout-minutes: 15
        run: |
          python3 deploy/lichess/fetch_bridge.py
          mkdir -p build/online3b-wheels
          python3 -m piptools compile --generate-hashes --output-file build/online3b-runtime.lock deploy/lichess/requirements.in
          cp build/online3b-runtime.lock deploy/lichess/requirements.lock
          python3 scripts/prepare-online3b-wheels.py --source-lock deploy/lichess/requirements.lock --wheelhouse build/online3b-wheels
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.lock
      - name: Build isolated offline-only integration image
        timeout-minutes: 15
        run: |
          docker build -f deploy/lichess/Dockerfile.offline --tag allfather-online3b-test:offline .
          docker image inspect allfather-online3b-test:offline --format '{{.Id}}' > build/online3b-image-id.txt
      - name: Prove container output mount is writable as the runner user
        run: |
          set -euo pipefail
          mkdir -p build/test-results/online-bridge-v1
          docker run --rm --network none --pids-limit 16 --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -v "$PWD/build/test-results/online-bridge-v1:/results:rw" \
            -w /work \
            allfather-online3b-test:offline \
            /opt/online3b/bin/python -c 'from pathlib import Path; p = Path("/results/.online3b-write-preflight"); p.write_text("ok\n", encoding="utf-8"); assert p.read_text(encoding="utf-8") == "ok\n"; p.unlink()'
          test ! -e build/test-results/online-bridge-v1/.online3b-write-preflight
      - name: Execute genuine bridge and Allfather games as both colors
        timeout-minutes: 24
        run: |
          set -euo pipefail
          mkdir -p build/test-results/online-bridge-v1
          for COLOR in white black; do
            docker run --rm --network none --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 6g \
              --user "$(id -u):$(id -g)" \
              -e ONLINE3B_ISOLATED_CONTAINER=1 \
              -v "$PWD:/work:ro" \
              -v "$PWD/build/test-results/online-bridge-v1:/results:rw" \
              -w /work \
              allfather-online3b-test:offline \
              /opt/online3b/bin/python /work/deploy/lichess/run_offline.py \
              --bridge /work/build/vendor/lichess-bot \
              --release /work/dist/online3a-stage \
              --color "$COLOR" --timeout 540 --output "/results/$COLOR"
          done
      - name: Independently qualify offline games
        run: |
          python3 scripts/qualify-online-bridge.py --evidence build/test-results/online-bridge-v1 --source-commit "$ALLFATHER_SOURCE_SHA"
      - name: Always retain offline API/game evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online3b-offline-game-evidence
          path: |
            build/test-results/online-bridge-v1/
            build/online3b-image-id.txt
            build/online3b-runtime.lock
            build/test-results/engine-opt-v2/report.json
          if-no-files-found: warn
          retention-days: 30
