name: Resource profile laboratory v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engines/**'
      - 'vendor.lock.json'
      - 'qualification/resource-lab-v1.json'
      - 'qualification/resource-profile-catalog-v1.json'
      - 'qualification/online-engine-opt-v2.json'
      - 'qualification/engine-opt-v2-selection.json'
      - 'qualification/engine-derived-lock.json'
      - 'qualification/lc0-strength.lock.json'
      - 'qualification/lc0-strength-profile.json'
      - 'config/allfather.online-hybrid-v2.validation.json'
      - 'tools/resource_lab/**'
      - 'tools/engine_opt/**'
      - 'tests/resource_lab/**'
      - 'tests/fixtures/engine_opt/**'
      - 'tests/harness/uci_session.py'
      - 'Makefile'
      - '.github/workflows/resource-profile-lab.yml'
      - 'scripts/build-online-engine-opt-v2.sh'
      - 'scripts/build-lc0-strength.sh'
      - 'scripts/fetch-stockfish-network.sh'
      - 'scripts/fetch-reckless-network.sh'
      - 'scripts/fetch-lc0-network.py'
      - 'scripts/vendor-lock.py'
      - 'scripts/verify-vendor.sh'
      - 'scripts/lc0-hardware-probe.py'
      - 'adapters/resource/linux_proc.py'
      - 'adapters/resource/linux_affinity.py'
      - 'controller/host_capabilities.py'
      - 'controller/host_pressure.py'
      - 'controller/runtime_substrate.py'

permissions:
  contents: read

env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: resource-profile-lab-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: J6 contract tests
        run: |
          python3 -m compileall -q tools/resource_lab tests/resource_lab tests/harness/uci_session.py
          python3 -m json.tool qualification/resource-lab-v1.json >/dev/null
          make resource-lab-tests

  build-candidate:
    needs: static-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config \
            libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev
      - name: Cache networks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/artifacts/stockfish
            build/artifacts/reckless
            build/artifacts/lc0
          key: resource-lab-v1-networks-${{ runner.os }}-${{ hashFiles('vendor.lock.json','qualification/lc0-strength.lock.json') }}
      - name: Build exact-head constituent bundle
        run: make build-online-engine-opt-v2
      - name: Validate exact candidate identity
        run: python3 scripts/qualify-engine-opt-v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-lab-v1-candidate
          path: |
            build/online-engine-opt-v2
            build/test-results/engine-opt-v2
          if-no-files-found: error
          retention-days: 14

  resource-lab:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout and bind runner environment
        run: |
          test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
          echo "ALLFATHER_RUNNER_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resource-lab-v1-candidate
          path: build/candidate-download
      - name: Restore exact candidate bundle
        run: |
          test -d build/candidate-download/online-engine-opt-v2
          rm -rf build/online-engine-opt-v2
          mv build/candidate-download/online-engine-opt-v2 build/online-engine-opt-v2
          chmod +x build/online-engine-opt-v2/bin/*
      - name: Install runtime measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libprotobuf-dev zlib1g-dev
      - name: Capture one canonical execution domain
        run: |
          mkdir -p build/test-results/resource-lab-v1
          python3 scripts/lc0-hardware-probe.py \
            > build/test-results/resource-lab-v1/host-probe.json
          python3 -m tools.engine_opt.domain capture \
            --probe build/test-results/resource-lab-v1/host-probe.json \
            --output build/test-results/resource-lab-v1/execution-domain.json
          python3 -m tools.engine_opt.domain validate \
            --input build/test-results/resource-lab-v1/execution-domain.json \
            --expected-source-commit "$ALLFATHER_SOURCE_SHA"
      - name: Execute one-pass isolated and composition laboratory
        run: |
          python3 -m tools.resource_lab.runner \
            --execution-domain build/test-results/resource-lab-v1/execution-domain.json \
            --output build/test-results/resource-lab-v1
      - name: Independently qualify retained evidence
        run: |
          python3 -m tools.resource_lab.qualify \
            --root build/test-results/resource-lab-v1 \
            --output build/test-results/resource-lab-v1/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-lab-v1
          path: build/test-results/resource-lab-v1
          if-no-files-found: error
          retention-days: 30
