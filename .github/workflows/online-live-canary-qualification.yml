name: ONLINE-PLAY-1 restricted Lichess dry-run (NO LIVE API)

on:
  pull_request:
    paths:
      - 'deploy/lichess/**'
      - 'deploy/live_canary/**'
      - 'qualification/**'
      - 'scripts/check-live-canary-boundary.py'
      - 'scripts/qualify-live-canary-host.py'
      - 'scripts/run-live-canary-dry-run.py'
      - 'scripts/verify-online-live-canary.py'
      - 'tests/lichess/**'
      - 'tests/release/**'
      - 'docs/ONLINE_PLAY_1_RUNBOOK.md'
      - 'docs/ONLINE_PLAY_1_THREAT_MODEL.md'
      - '.github/workflows/online-live-canary-qualification.yml'
      - 'controller/**'
      - 'engines/**'
      - 'config/**'
      - 'vendor.lock.json'
  # Deliberately NO workflow_dispatch, push, production environment or secrets.
permissions:
  contents: read
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
concurrency:
  group: online-play-1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Fast source and offline prohibition checks
        run: |
          set -euo pipefail
          # Hosted ubuntu-24.04 already includes Python/pip/venv. APT index
          # refresh is not a unit-test prerequisite; keep the frozen hashes.
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 -m compileall -q deploy/lichess deploy/live_canary tests/lichess scripts
          python3 -m json.tool qualification/online-live-canary-v1.json >/dev/null
          python3 -m json.tool qualification/schemas/online-live-canary-v1.schema.json >/dev/null
          python3 -m json.tool qualification/schemas/online-live-admission-v1.schema.json >/dev/null
          python3 scripts/check-live-canary-boundary.py --output build/test-results/online-play-1/source-boundary.json
          python3 -m unittest discover -s tests/release -p 'test_live_release_boundary.py' -v
          python3 scripts/release-promotion-policy.py --output build/test-results/online-play-1/release-prohibition.json
      - name: Retain ONLY policy checks, never key or image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-source-boundary
          path: |
            build/test-results/online-play-1/source-boundary.json
            build/test-results/online-play-1/release-prohibition.json
          if-no-files-found: warn
          retention-days: 14

  gateway-unit:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - run: |
          set -euo pipefail
          # Hosted ubuntu-24.04 already includes Python/pip/venv. APT index
          # refresh is not a unit-test prerequisite; keep the frozen hashes.
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 -m unittest tests.lichess.test_live_gateway tests.lichess.test_live_canary_http tests.lichess.test_live_canary_protocol tests.lichess.test_live_canary_redaction -v

  bridge-supervisor-unit:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - run: |
          set -euo pipefail
          # Hosted ubuntu-24.04 already includes Python/pip/venv. APT index
          # refresh is not a unit-test prerequisite; keep the frozen hashes.
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
          python3 deploy/lichess/fetch_bridge.py
          python3 -m unittest tests.lichess.test_live_bridge_policy tests.lichess.test_live_canary_supervisor -v
          python3 -m unittest discover -s tests/lichess -p 'test_live_*.py' -v

  network-integration:
    needs: [gateway-unit, bridge-supervisor-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Build real three-engine sealed UCI with unchanged controller
        timeout-minutes: 40
        run: |
          set -euo pipefail
          bash scripts/ci-install-apt-deps.sh build-essential meson ninja-build pkg-config libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev python3-pip python3-venv
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
          python3 scripts/release-manifest.py create
          python3 scripts/release-manifest.py verify
          python3 scripts/package-online.py
          python3 dist/online3a-stage/deploy/bin/allfather-online --check
      - name: Prepare pinned upstream and exact source-locked wheelhouse
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 deploy/lichess/fetch_bridge.py
          mkdir -p build/online3b-wheels
          python3 scripts/verify-release-python-lock.py
          python3 scripts/prepare-online3b-wheels.py --source-lock deploy/lichess/requirements.release.lock --wheelhouse build/online3b-wheels
          python3 scripts/verify-release-python-lock.py --wheelhouse build/online3b-wheels
      - name: Build only local, synthetic Docker images (NEVER push)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Ubuntu mirrors can be temporarily inconsistent during publication.
          # Retry a fresh integrity-checked APT acquisition; never enable
          # unauthenticated indexes, ignore size/hash failures, or reuse stale ones.
          succeeded=0
          for attempt in 1 2 3; do
            if docker build -f deploy/lichess/Dockerfile.offline -t allfather-online4b-offline:pr-a-test .; then
              succeeded=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          test "$succeeded" -eq 1
          docker build -f deploy/live_canary/Dockerfile.test --build-arg BASE_IMAGE=allfather-online4b-offline:pr-a-test -t allfather-canary-test:private .
          docker image inspect allfather-canary-test:private --format '{{.Id}}'
      - name: Verify exact pinned upstream, live configuration and sealed engine WITHOUT network
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Keep raw Docker stderr only in ephemeral runner temp storage. Never
          # publish it: even unexpected transport errors can contain host data.
          raw_stderr="$(mktemp)"
          trap 'rm -f "$raw_stderr"' EXIT
          set +e
          docker run --rm --network none --read-only --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --tmpfs /tmp:size=1073741824,mode=1777 \
            -e PYTHONPATH=/work -e PYTHONDONTWRITEBYTECODE=1 \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -e GIT_CONFIG_KEY_1=safe.directory \
            -e GIT_CONFIG_VALUE_1=/work/build/vendor/lichess-bot \
            -v "$PWD:/work:ro" \
            --entrypoint /opt/online3b/bin/python allfather-canary-test:private \
            /work/scripts/preflight-live-canary-stage.py --source-sha "$HEAD_SHA" 2>"$raw_stderr"
          status=$?
          set -e
          python3 scripts/sanitize_live_canary_preflight.py \
            --raw-stderr "$raw_stderr" --exit-code "$status" \
            --output build/test-results/online-play-1/preflight-incomplete.json
          rm -f "$raw_stderr"
          test "$status" -eq 0
      - name: Retain only allowlisted preflight failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-stage-diagnostics
          path: build/test-results/online-play-1/preflight-incomplete.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Prove real PID1 child containment with a SIGTERM-resistant worker
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --pids-limit 32 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            -e PYTHONPATH=/work -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/work:ro" \
            --entrypoint /opt/online3b/bin/python allfather-canary-test:private \
            -c 'import subprocess,json; from deploy.live_canary.supervisor import reap_namespace; worker=subprocess.Popen(["/opt/online3b/bin/python","-u","-c","import signal,time; signal.signal(signal.SIGTERM,signal.SIG_IGN); print(\"READY\",flush=True); time.sleep(120)"],stdout=subprocess.PIPE,text=True); assert worker.stdout.readline().strip()=="READY"; receipt=reap_namespace(deadline_s=7); assert receipt["pid_namespace_isolated"] and receipt["sigterm_sent"]>=1 and receipt["sigkill_sent"]>=1 and receipt["live_remaining"]==0; print(json.dumps(receipt,sort_keys=True))'
      - name: Play a real sealed Allfather game against fake API as WHITE
        timeout-minutes: 17
        run: |
          python3 scripts/run-live-canary-dry-run.py --color white --image allfather-canary-test:private --source-sha "$HEAD_SHA" --output build/test-results/online-play-1/white
      - name: Play a real sealed Allfather game against fake API as BLACK
        timeout-minutes: 17
        run: |
          python3 scripts/run-live-canary-dry-run.py --color black --image allfather-canary-test:private --source-sha "$HEAD_SHA" --output build/test-results/online-play-1/black
      - name: Execute real two-color integration verifier contract
        env:
          ALLFATHER_PR_A_GAME_EVIDENCE: build/test-results/online-play-1
          ALLFATHER_PR_A_EXACT_HEAD: ${{ env.HEAD_SHA }}
        run: python3 -m unittest tests.lichess.test_live_canary_integration -v
      - name: Retain sanitized HTTP/journal/PGN only; NEVER image/secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-fake-games
          path: |
            build/test-results/online-play-1/white/integration.json
            build/test-results/online-play-1/white/gateway/server.json
            build/test-results/online-play-1/white/gateway/gateway-state.json
            build/test-results/online-play-1/white/bridge/report.json
            build/test-results/online-play-1/white/bridge/replays/**
            build/test-results/online-play-1/black/integration.json
            build/test-results/online-play-1/black/gateway/server.json
            build/test-results/online-play-1/black/gateway/gateway-state.json
            build/test-results/online-play-1/black/bridge/report.json
            build/test-results/online-play-1/black/bridge/replays/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain ONLY bounded negative diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: online-play-1-incomplete-diagnostics
          path: |
            build/test-results/online-play-1/white/incomplete.json
            build/test-results/online-play-1/white/cleanup-incomplete.json
            build/test-results/online-play-1/white/bridge/failure.json
            build/test-results/online-play-1/white/gateway/failure.json
            build/test-results/online-play-1/black/incomplete.json
            build/test-results/online-play-1/black/cleanup-incomplete.json
            build/test-results/online-play-1/black/bridge/failure.json
            build/test-results/online-play-1/black/gateway/failure.json
          if-no-files-found: warn
          retention-days: 14

  independent-canary-verdict:
    needs: [source-boundary, gateway-unit, bridge-supervisor-unit, network-integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install independent PGN/legal replay oracle
        run: |
          # Hosted ubuntu-24.04 already includes Python/pip/venv. APT index
          # refresh is not a unit-test prerequisite; keep the frozen hashes.
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          python3 -m pip install --break-system-packages --require-hashes -r deploy/lichess/requirements.release.lock
      - name: Refuse an absent or unsuccessful two-color producer
        if: ${{ needs.network-integration.result != 'success' }}
        run: |
          mkdir -p build/test-results/online-play-1
          python3 - <<'PY'
          import json,pathlib
          output=pathlib.Path("build/test-results/online-play-1/independent-verdict.json")
          output.write_text(json.dumps({"schema_version":1,"verdict":"NOT_RUN",
              "scope":"fake-lichess-api-only",
              "reason":"required producer not completed",
              "live_game_authorized":False,"public_bot_release":False},
              sort_keys=True)+"\n")
          PY
          exit 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ needs.network-integration.result == 'success' }}
        with:
          name: online-play-1-fake-games
          path: build/test-results/online-play-1
      - name: Source-independent read-only verifier, neither producer's PASS nor tests
        if: ${{ needs.network-integration.result == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/check-live-canary-boundary.py
          python3 scripts/verify-online-live-canary.py \
            --policy qualification/online-live-canary-v1.json \
            --evidence build/test-results/online-play-1 \
            --source-sha "$HEAD_SHA" --mode offline-dry-run \
            --output build/test-results/online-play-1/independent-verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: online-play-1-independent-verdict
          path: build/test-results/online-play-1/independent-verdict.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    needs: [source-boundary, gateway-unit, bridge-supervisor-unit,
            network-integration, independent-canary-verdict]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: No skipped/unverified success promotion
        env:
          JOB_CONTEXT: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          needs=json.loads(os.environ['JOB_CONTEXT'])
          print('## ONLINE-PLAY-1 — PR-A fake API only' )
          print('No Lichess credentials, Bot API calls, account upgrade, deployment or release.')
          bad=[(name,value.get('result')) for name,value in needs.items()
               if value.get('result')!='success']
          print('Job results:',{k:v.get('result') for k,v in needs.items()})
          if bad:
              print('NOT QUALIFIED: '+repr(bad))
              sys.exit(2)
          PY
