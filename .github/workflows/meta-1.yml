name: M14-J J13 META-1 matched authority control

on:
  pull_request:
    paths:
      - 'controller/**'
      - 'tools/meta1/**'
      - 'tools/local_game/**'
      - 'scripts/qualify-meta-1.py'
      - 'qualification/meta-1-v1.json'
      - 'qualification/engine-opt-v2-selection.json'
      - 'qualification/engine-opt-v2-evidence.json'
      - 'config/allfather.online-engine-opt-v2.json'
      - 'config/allfather.online-hybrid-v2.validation.json'
      - 'config/allfather.m14-j-j8.validation.json'
      - 'config/allfather.m14-j-j9.validation.json'
      - 'config/allfather.m14-j-j10.validation.json'
      - 'config/allfather.orchestrated-v1.validation.json'
      - 'tests/meta1/**'
      - 'tests/fixtures/meta1/**'
      - 'tests/fixtures/meta1-mini/**'
      - 'Makefile.local-game'
      - '.github/workflows/meta-1.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label for the real META-1 campaign (must qualify J12 authority)'
        required: true
        default: 'ubuntu-24.04'

permissions:
  contents: read

env:
  ALLFATHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: meta1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Install pinned test dependency
        run: |
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps             --require-hashes -r qualification/local-game-requirements.txt
      - name: Compile and validate META-1 contracts
        run: |
          python3 -m compileall -q tools/meta1 scripts/qualify-meta-1.py tests/meta1 tests/controller/test_meta1_anchor_control.py
          python3 -m json.tool qualification/meta-1-v1.json >/dev/null
          make -f Makefile.local-game meta1-tests

  fastchess-source-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - name: Match upstream Fastchess Linux test host
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run pinned Fastchess source tests
        run: python3 -m tools.local_game.build_fastchess --source-test-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta1-fastchess-source-test
          path: build/fastchess-source-test/attestation.json
          if-no-files-found: error
          retention-days: 14

  mini-e2e:
    needs: [static-contracts, fastchess-source-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta1-fastchess-source-test
          path: build/fastchess-source-test
      - name: Install pinned runtime dependency
        run: |
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps             --require-hashes -r qualification/local-game-requirements.txt
      - name: Build pinned Fastchess
        run: make -f Makefile.local-game build-fastchess
      - name: Execute four-game reversed-color META-1 smoke
        env:
          META1_FASTCHESS: ${{ github.workspace }}/build/tools/fastchess/bin/fastchess
        run: |
          python3 -m tools.meta1.mini_e2e --fastchess "$META1_FASTCHESS"
          python3 -m unittest tests.meta1.test_end_to_end -v
      - name: Upload mini artifact transport fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta1-mini-transport
          path: |
            build/test-results/meta1-mini
            build/tools/fastchess
          if-no-files-found: error
          retention-days: 14

  mini-artifact-roundtrip:
    needs: mini-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta1-mini-transport
          path: build
      - name: Verify build-root artifact restoration contract
        run: |
          test -f build/test-results/meta1-mini/report.json
          test -f build/tools/fastchess/build-manifest.json
          python3 -m json.tool build/test-results/meta1-mini/report.json >/dev/null
          python3 -m json.tool build/tools/fastchess/build-manifest.json >/dev/null

  campaign:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [static-contracts, fastchess-source-tests, mini-e2e, mini-artifact-roundtrip]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact merged-main checkout and bind attempt identity
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
          echo "ALLFATHER_RUNNER_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "META1_CAMPAIGN_ID=${ALLFATHER_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta1-fastchess-source-test
          path: build/fastchess-source-test
      - name: Install build and campaign dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential git meson ninja-build pkg-config             libprotobuf-dev protobuf-compiler zlib1g-dev libopenblas-dev             python3-pip python3-setuptools python3-wheel
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps             --require-hashes -r qualification/local-game-requirements.txt
      - name: Build exact-head ENGINE-OPT-V2 bundle
        run: |
          make build-online-engine-opt-v2
          python3 scripts/qualify-engine-opt-v2.py
      - name: Capture canonical execution domain
        run: |
          mkdir -p build/test-results/engine-opt-v2-profile-domain
          python3 scripts/lc0-hardware-probe.py             > build/test-results/engine-opt-v2-profile-domain/host-probe.json
          python3 -m tools.engine_opt.domain capture             --probe build/test-results/engine-opt-v2-profile-domain/host-probe.json             --output build/test-results/engine-opt-v2-profile-domain/execution-domain.json
          python3 -m tools.engine_opt.domain validate             --input build/test-results/engine-opt-v2-profile-domain/execution-domain.json             --expected-source-commit "$ALLFATHER_SOURCE_SHA"
      - name: Gate META-1 on real J12 authority qualification
        env:
          ALLFATHER_EXECUTION_DOMAIN_PATH: build/test-results/engine-opt-v2-profile-domain/execution-domain.json
        run: python3 scripts/qualify-resource-orchestration.py --record-disposition
      - name: Build pinned Fastchess
        run: make -f Makefile.local-game build-fastchess
      - name: Capture immutable META-1 host/source preflight
        run: |
          python3 -m tools.meta1.preflight pre             --j12-report build/test-results/engine-opt-v2-profile-domain/j12/report.json             --output build/test-results/meta1-preflight/preflight.json
      - name: Run one immutable META-1 attempt or retain the gated disposition
        run: |
          python3 -m tools.meta1.runner             --j12-report build/test-results/engine-opt-v2-profile-domain/j12/report.json             --preflight build/test-results/meta1-preflight/preflight.json             --output "build/test-results/meta1/$META1_CAMPAIGN_ID"
      - name: Upload raw immutable META-1 evidence and exact build identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta1-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/meta1
            build/test-results/meta1-preflight
            build/test-results/engine-opt-v2-profile-domain/j12
            build/test-results/engine-opt-v2-profile-domain/execution-domain.json
            build/test-results/engine-opt-v2-profile-domain/host-probe.json
            build/tools/fastchess
            build/online-engine-opt-v2
          if-no-files-found: error
          retention-days: 90

  independent-verify:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.campaign.result != 'skipped' }}
    needs: campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ALLFATHER_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$ALLFATHER_SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta1-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - name: Verify restored raw evidence layout
        run: |
          META1_CAMPAIGN_ID="${ALLFATHER_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f "build/test-results/meta1/$META1_CAMPAIGN_ID/manifest.json"
          test -f build/test-results/meta1-preflight/preflight.json
          test -f build/test-results/engine-opt-v2-profile-domain/j12/report.json
          test -f build/test-results/engine-opt-v2-profile-domain/execution-domain.json
          test -f build/test-results/engine-opt-v2-profile-domain/host-probe.json
          test -f build/tools/fastchess/build-manifest.json
          test -f build/online-engine-opt-v2/build-manifest.json
      - name: Install independent validator dependency
        run: |
          python3 -m pip install --break-system-packages --no-build-isolation --no-deps             --require-hashes -r qualification/local-game-requirements.txt
      - name: Independently reconstruct campaign from raw evidence
        run: |
          META1_CAMPAIGN_ID="${ALLFATHER_SOURCE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/qualify-meta-1.py             --campaign "build/test-results/meta1/$META1_CAMPAIGN_ID"             --output-report "build/test-results/meta1/$META1_CAMPAIGN_ID/report-independent.json"
      - name: Retain authoritative independent qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta1-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/meta1
            build/test-results/meta1-preflight
            build/test-results/engine-opt-v2-profile-domain/j12
            build/test-results/engine-opt-v2-profile-domain/execution-domain.json
            build/test-results/engine-opt-v2-profile-domain/host-probe.json
            build/tools/fastchess
            build/online-engine-opt-v2
          if-no-files-found: error
          retention-days: 90
