name: Reckless portable source build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - engines/reckless/**
      - scripts/fetch-reckless-network.py
      - scripts/fetch-reckless-network.sh
      - vendor.lock.json
      - .github/workflows/reckless-portable-build.yml
  pull_request:
    paths:
      - engines/reckless/**
      - scripts/fetch-reckless-network.py
      - scripts/fetch-reckless-network.sh
      - vendor.lock.json
      - .github/workflows/reckless-portable-build.yml

permissions:
  contents: read

concurrency:
  group: reckless-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Toolchain versions
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Verify portable pinned-NNUE source build
        working-directory: engines/reckless
        env:
          PYTHON: python
        run: cargo check --release --no-default-features
